<form id="quoteForm" style="max-width:700px; margin:35px auto 0; text-align:left;">

    <!-- Company Name -->
    <div style="margin-bottom:18px;">
        <label for="company" style="display:block; margin-bottom:7px; font-weight:bold;">
            Company Name <span style="color:#ef4444;">*</span>
        </label>

        <input
            type="text"
            id="company"
            placeholder="e.g. ABC Builders / XYZ Contractors"
            required
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- Contact Person -->
    <div style="margin-bottom:18px;">
        <label for="contactPerson" style="display:block; margin-bottom:7px; font-weight:bold;">
            Contact Person <span style="color:#ef4444;">*</span>
        </label>

        <input
            type="text"
            id="contactPerson"
            placeholder="Your Name"
            required
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- WhatsApp Number -->
    <div style="margin-bottom:18px;">
        <label for="phone" style="display:block; margin-bottom:7px; font-weight:bold;">
            WhatsApp Number <span style="color:#ef4444;">*</span>
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="03XX XXXXXXX"
            required
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- Email -->
    <div style="margin-bottom:18px;">
        <label for="email" style="display:block; margin-bottom:7px; font-weight:bold;">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="company@email.com"
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- Location -->
    <div style="margin-bottom:18px;">
        <label for="location" style="display:block; margin-bottom:7px; font-weight:bold;">
            Project / Delivery Location <span style="color:#ef4444;">*</span>
        </label>

        <input
            type="text"
            id="location"
            placeholder="e.g. DHA Phase 6, Karachi"
            required
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- Brand -->
    <div style="margin-bottom:18px;">
        <label for="brand" style="display:block; margin-bottom:7px; font-weight:bold;">
            Brand / Manufacturer
        </label>

        <input
            type="text"
            id="brand"
            placeholder="e.g. Dadex, Pak Arab, Polydex, Any Brand"
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- Product -->
    <div style="margin-bottom:18px;">
        <label for="product" style="display:block; margin-bottom:7px; font-weight:bold;">
            Product / Material Required <span style="color:#ef4444;">*</span>
        </label>

        <input
            type="text"
            id="product"
            placeholder="e.g. PPRC Pipe & Fittings"
            required
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
        >
    </div>


    <!-- Size -->
    <div style="display:flex; gap:15px; margin-bottom:18px;">

        <div style="width:50%;">
            <label for="size" style="display:block; margin-bottom:7px; font-weight:bold;">
                Size / Specification
            </label>

            <input
                type="text"
                id="size"
                placeholder="e.g. 32mm PN-20"
                style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
            >
        </div>


        <div style="width:50%;">
            <label for="quantity" style="display:block; margin-bottom:7px; font-weight:bold;">
                Quantity
            </label>

            <input
                type="text"
                id="quantity"
                placeholder="e.g. 500 pcs"
                style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px;"
            >
        </div>

    </div>


    <!-- Additional Requirements -->
    <div style="margin-bottom:22px;">
        <label for="message" style="display:block; margin-bottom:7px; font-weight:bold;">
            Additional Requirements
        </label>

        <textarea
            id="message"
            placeholder="Tell us any additional specifications, delivery requirements or project details..."
            rows="5"
            style="width:100%; padding:15px; border:none; border-radius:8px; font-size:16px; resize:vertical;"
        ></textarea>
    </div>


    <!-- Submit -->
    <button
        type="submit"
        class="btn"
        style="
            width:100%;
            border:none;
            cursor:pointer;
            font-size:18px;
            padding:17px;
            border-radius:8px;
            font-weight:bold;
        "
    >
        SEND QUOTATION REQUEST ON WHATSAPP →
    </button>

</form>
